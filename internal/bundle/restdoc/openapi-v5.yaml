# Grafana Cloud k6 v5 Metrics REST API.
#
# Source of truth (prose):
#   https://grafana.com/docs/grafana-cloud/testing/k6/reference/cloud-rest-api/metrics/
# Last reviewed: 2026-05-18
#
# The v5 API does not publish an OpenAPI document. This file is
# hand-authored to mirror the prose documentation above so that the
# `k6 x rest` discovery commands can surface v5 metrics endpoints
# alongside the v6 ones.
#
# Wire-format note. The `query_range_k6`, `query_aggregate_k6`, and
# (multi-run) `metrics` endpoints take their arguments in OData-style
# function-call syntax in the URL path itself, e.g.
#
#     /cloud/v5/test_runs/152779/query_range_k6(metric='http_reqs',query='rate',step=5)
#
# OpenAPI 3 cannot express arbitrary function-call parameters natively,
# so this spec represents concrete multi-run metrics forms explicitly
# (`metrics(test_run_count={testRunCount})`) and represents flexible
# query expressions with a `{parameters}` path placeholder. The wire
# format note appears in each affected operation's description.
#
# To partially compensate for the lost type info on `{parameters}`
# placeholders, every function-call operation in this spec carries an
# `x-odata-function-call` extension under its `get` block. The extension
# captures the function's name and its parameter list (name, OData type,
# required flag, optional description) so downstream code-generators and
# documentation tools can build typed call-site helpers without having
# to parse free-text descriptions. The extension's shape:
#
#     x-odata-function-call:
#       name: <function-name>             # e.g. query_range_k6
#       parameters:
#       - name: <arg-name>                # e.g. query
#         type: <Edm.*>                   # e.g. Edm.String, Edm.Int64,
#                                         #      Edm.DateTimeOffset,
#                                         #      Collection(Edm.Int64)
#         required: true | false
#         description: <free-text>        # optional
#       constraints:                      # optional, free-form list
#       - <free text constraint>
#
# `Edm.String` values are emitted single-quoted on the wire;
# `Edm.DateTimeOffset` values are bare and require a timezone
# designator; collection-typed values use literal square brackets
# (`test_run_ids=[1,2,3]`). The extension is an aid; the operation
# description remains the authoritative source for behavioural quirks.
#
# Curl caveat. The literal `[` and `]` in `(test_run_ids=[...])`
# paths trigger curl's URL-globbing and produce `curl: (3) bad range
# in URL position`. Either run curl with `-g` (`--globoff`) to
# disable globbing, or rely on percent-encoding: the v5 API accepts
# both the literal forms (`(`, `)`, `[`, `]`) and their
# percent-encoded equivalents (`%28`, `%29`, `%5B`, `%5D`). Most HTTP
# libraries (Python `requests`, JS `fetch`, etc.) percent-encode
# `[]` automatically.
#
# Authentication is documented as the same `k6ApiToken` bearer scheme
# used by the v6 spec (Personal API token or Grafana Stack API token).
# This file omits `X-Stack-Id` because the v5 metrics docs do not
# document it; callers going through the Grafana plugin-proxy have the
# stack scoping handled for them by the proxy, and direct calls to
# `api.k6.io/cloud/v5/...` accept the bearer token alone.
#
# Error handling.
#   * 400 -- request validation failed *after* the URL parsed cleanly
#            in the OData layer. Body is one of `ErrorResponse`
#            (simple `{error: {code, message}}`) or
#            `ValidationErrorResponse` (`{error: {code:
#            "validation_error", details: [...], message, target}}`).
#            Triggered by:
#              - an unparseable Prometheus selector on `/series`,
#                `/labels`, or `/label/{name}/values` -- yields the
#                simple envelope,
#              - a query expression incompatible with the metric type
#                (e.g. `rate` on a trend metric) -- simple envelope,
#              - an OData literal that parses as one type but cannot
#                be coerced to the parameter's declared type (e.g.
#                `test_run_count=1.5` -- `Decimal('1.5')` for an
#                `Edm.Int64` parameter; or `start='2025-01-01T00:00Z'`
#                -- string for `Edm.DateTimeOffset`) -- yields the
#                validation-error envelope, with one entry in
#                `details[]` per offending parameter.
#   * 401 -- missing, malformed, or revoked token. Body is
#            `ErrorResponse`. Two observed `message` values:
#            `"Authentication required"` when no `Authorization`
#            header is sent, and `"Invalid token"` when the header
#            is present but the token is unrecognised.
#   * 403 -- two distinct cases, both with `ErrorResponse` bodies.
#            Distinguish them by `error.message`:
#              - `"Authentication error - could not find or access
#                requested resource."` -- the caller lacks access or
#                the resource does not exist. The v5 API deliberately
#                conflates these two so it does not leak test-run /
#                load-test existence; 404 is NOT used for missing
#                resources.
#              - `"Validation failed"` -- a server-side validator
#                rejected an argument (currently observed for
#                negative `test_run_count` values on the multi-run
#                operations). This case is best thought of as a
#                "should-have-been-400 but the framework picked 403"
#                quirk; callers wanting to distinguish "no access"
#                from "bad input" must match on the message text.
#   * 404 -- the URL did not match any OData route. Body is
#            `ErrorResponse` whose `message` is the OData parser's
#            `ParseException` text. Triggered by:
#              - a function-call signature with a missing required
#                key, an unrecognised extra key, or a literal that
#                cannot be parsed as any OData type
#                (e.g. `step=not-a-number`, naive `start`/`end`,
#                or both `test_run_count` and `test_run_ids` together),
#              - structural URL faults that don't even reach the
#                function-call layer: a trailing slash on an
#                otherwise-valid path, a non-numeric value where a
#                numeric ID was expected (`/test_runs/abc/metrics`),
#                or an empty bracket list (`test_run_ids=[]`).
#              - an unrecognised query-string parameter on routes
#                that the OData parser treats as function-call
#                endpoints (e.g. `/cloud/v5/test_runs/{id}/labels?foo=bar`,
#                `/cloud/v5/test_runs/{id}/series?foo=bar` with NO
#                valid `match[]`, `/cloud/v5/load_tests/{id}/metrics?foo=bar`).
#                NOT all v5 routes behave this way: routes the OData
#                parser treats as plain entity-set GETs silently
#                ignore unknown query-string parameters and return
#                HTTP 200 (`/cloud/v5/test_runs/{id}/metrics?foo=bar`),
#                as does `/series` once a valid `match[]` accompanies
#                the unknown parameter. There is no public API for
#                determining which route shape a path uses; consumers
#                that need this distinction should treat the unknown-
#                parameter status as endpoint-specific.
#            Distinct from "resource not found" (which is 403 -- see
#            above).
#   * 405 -- non-GET method (POST, PUT, PATCH, DELETE) on any v5
#            metrics path. Body is `ErrorResponse`.
#   * 500 -- server error. Known cases at the time of writing:
#              - `GET /cloud/v5/test_runs/{id}/labels?match[]=...`
#                returns 500 regardless of selector (single or
#                multiple match[] values). Workaround: omit `match[]`
#                on `/labels` and post-filter client-side, or use
#                `/series` with the same selector.
#              - `query_range_k6(...,step=0)` and negative `step`
#                values return 500 instead of 400.
#            Body is `ErrorResponse` with `message: "Unknown error"`.
openapi: 3.0.0
info:
  title: Grafana Cloud k6 v5 Metrics REST API
  version: '5'
  description: |-
    Metrics endpoints for Grafana Cloud k6 test runs. These are the v5
    counterparts to the v6 endpoints documented at
    https://api.k6.io/cloud/v6/openapi, and live under `/cloud/v5/`.

    Version reminder. Every path in this spec is prefixed with
    `/cloud/v5/`; callers must pin to the `v5` major and not mix v5
    paths into v6 base URLs (or vice versa) or the requests will 404.

    Accept header. The official documentation shows
    `Accept: application/json` on every example request. The live API
    returns JSON regardless of the header, but callers that round-trip
    through caches or content-negotiating proxies should send it
    anyway to lock the response media type.
servers:
- url: https://api.k6.io
  description: Grafana Cloud k6 REST API root.
paths:

  /cloud/v5/test_runs/{testRunId}/metrics:
    get:
      operationId: test_run_metrics_list
      summary: List metrics emitted by a single test run.
      description: |-
        Returns every metric emitted by a single test run, including
        built-in k6 metrics (e.g. `http_req_duration`, `vus`,
        `data_sent`) and any user-defined metrics.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: testRunId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the test run.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunMetricListResponse'
              examples:
                OK:
                  value:
                    value:
                    - id: 1af77c11-5b93-58ba-b7a2-c839b0402cf7
                      name: load_generator_file_handles
                      origin: builtin
                      test_run_id: 152779
                      type: gauge
                    - id: 38ae6276-4630-5ad6-a3bb-d11f678d96dd
                      name: iteration_duration
                      origin: builtin
                      test_run_id: 152779
                      type: trend
                    - id: 4643ca9f-9539-5e86-9937-2ae956f9dcc4
                      name: data_sent
                      origin: builtin
                      test_run_id: 152779
                      type: counter
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /cloud/v5/load_tests/{loadTestId}/metrics:
    get:
      operationId: load_test_metrics_list
      summary: List metrics across the last 30 runs of a load test.
      description: |-
        Returns metrics metadata aggregated across the last 30 runs of
        the load test. Useful for understanding which metrics and
        labels are available across runs.

        Use `metrics(test_run_count={testRunCount})` to choose a
        different number of recent runs, or
        `metrics(test_run_ids=[{testRunIds}])` to choose specific runs.

        The `/ms` paths are aliases of these `/metrics` paths.

        Per-run breakdown note. The `LoadTestMetric` shape returned
        by this endpoint does not include a `test_run_id` field, so
        callers cannot tell from the response alone which runs went
        into the aggregate. To discover the contributing run IDs,
        issue a `query_aggregate_k6(...)` call with the same
        `test_run_count` (or `test_run_ids`) and inspect the
        `test_run_id` label on each row of the result.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
              examples:
                OK:
                  value:
                    value:
                    - name: http_req_duration
                      type: trend
                      labels: [expected_response, group, method, name, proto, scenario, status, url]
                    - name: http_reqs
                      type: counter
                      labels: [expected_response, group, method, name, proto, scenario, status, url]
                    - name: vus
                      type: gauge
                      labels: [load_zone]
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/load_tests/{loadTestId}/metrics(test_run_count={testRunCount})':
    get:
      operationId: load_test_metrics_list_by_count
      x-odata-function-call:
        name: metrics
        parameters:
        - name: test_run_count
          type: Edm.Int64
          required: true
          description: |-
            Number of most-recent runs to include. `0` is silently
            treated as the default count; values larger than the
            number of available runs are silently capped; negative
            values return HTTP 403 'Validation failed'.
      summary: List metrics across the last N runs of a load test.
      description: |-
        Returns metrics metadata aggregated across the last
        `testRunCount` runs of the load test.

        Wire format note. `test_run_count` is part of the path's
        parenthesized function-call syntax, not a conventional query
        string parameter.

        Bounds and silent quirks of `test_run_count`:
          * Negative values (`-1`, `-2`, ...) return HTTP 403 with
            `error.message: "Validation failed"` (see `Forbidden`).
          * Zero is silently treated as the default (≈ last 30
            runs); the response is the same as calling
            `/metrics` without the function-call.
          * Values larger than the number of available runs are
            silently capped at the number of available runs.
          * Non-integer numeric literals (e.g. `1.5`) return HTTP
            400 with the `validation_error` envelope (see
            `BadRequest`).
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      - in: path
        name: testRunCount
        required: true
        schema:
          type: integer
          minimum: 0
        description: |-
          Number of most-recent runs to include. Must be non-negative
          (negative -> 403 `"Validation failed"`). `0` is silently
          treated as the default count; larger values are silently
          capped at the number of available runs.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/load_tests/{loadTestId}/metrics(test_run_ids=[{testRunIds}])':
    get:
      operationId: load_test_metrics_list_by_ids
      x-odata-function-call:
        name: metrics
        parameters:
        - name: test_run_ids
          type: Collection(Edm.Int64)
          required: true
          description: |-
            Test run IDs to aggregate. Must contain at least one ID;
            an empty list (`[]`) returns 404. Unknown IDs (including
            `0`) are silently filtered to value=[]. Whitespace
            between elements is tolerated.
      summary: List metrics across specific runs of a load test.
      description: |-
        Returns metrics metadata aggregated across the selected test run
        IDs for the load test.

        Wire format note. `test_run_ids` is part of the path's
        parenthesized function-call syntax, not a conventional query
        string parameter. The square brackets are literal; the
        `testRunIds` placeholder is the comma-separated content inside
        them, e.g. `152779,152782,152785`.

        Bounds and silent quirks of `test_run_ids`:
          * The list must contain at least one ID. An empty list
            (`test_run_ids=[]`) returns HTTP 404 (`Expected end of
            text, found '('`) -- see `NotFound`.
          * IDs that do not belong to the load test (including
            `0` and arbitrary unknown values) are silently filtered
            out; the response is HTTP 200 with `value: []` when no
            IDs in the list match.
          * Whitespace between IDs (`[a, b]` with a space after the
            comma) is tolerated by the OData parser.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      - in: path
        name: testRunIds
        required: true
        schema:
          type: string
        description: |-
          Comma-separated test run IDs inside literal square brackets.
          Must contain at least one ID; an empty list returns 404.
          Unknown IDs are silently filtered.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /cloud/v5/load_tests/{loadTestId}/ms:
    get:
      operationId: load_test_metrics_ms_alias_list
      summary: Alias for listing metrics across the last 30 runs.
      description: |-
        Alias of `/cloud/v5/load_tests/{loadTestId}/metrics`. The k6 UI
        uses this path to avoid browser ad blockers; API callers may use
        either path.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/load_tests/{loadTestId}/ms(test_run_count={testRunCount})':
    get:
      operationId: load_test_metrics_ms_alias_by_count
      x-odata-function-call:
        name: ms
        parameters:
        - name: test_run_count
          type: Edm.Int64
          required: true
          description: |-
            Alias of the same parameter on `load_test_metrics_list_by_count`.
            See that operation's `x-odata-function-call` for the bounds
            and silent quirks.
      summary: Alias for listing metrics across the last N runs.
      description: |-
        Alias of
        `/cloud/v5/load_tests/{loadTestId}/metrics(test_run_count={testRunCount})`.
        See that operation's description for the bounds and silent
        quirks of `test_run_count` (`0` -> default, negative -> 403
        `"Validation failed"`, `1.5` -> 400 `validation_error`,
        silent cap at available runs).
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      - in: path
        name: testRunCount
        required: true
        schema:
          type: integer
          minimum: 0
        description: |-
          Number of most-recent runs to include. Must be non-negative
          (negative -> 403 `"Validation failed"`). `0` is silently
          treated as the default count; larger values are silently
          capped at the number of available runs.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/load_tests/{loadTestId}/ms(test_run_ids=[{testRunIds}])':
    get:
      operationId: load_test_metrics_ms_alias_by_ids
      x-odata-function-call:
        name: ms
        parameters:
        - name: test_run_ids
          type: Collection(Edm.Int64)
          required: true
          description: |-
            Alias of the same parameter on `load_test_metrics_list_by_ids`.
            See that operation's `x-odata-function-call` for the bounds
            and silent quirks.
      summary: Alias for listing metrics across specific runs.
      description: |-
        Alias of
        `/cloud/v5/load_tests/{loadTestId}/metrics(test_run_ids=[{testRunIds}])`.
        See that operation's description for the bounds and silent
        quirks of `test_run_ids` (empty list `[]` -> 404; unknown
        IDs silently filtered; whitespace tolerated after commas).
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      - in: path
        name: testRunIds
        required: true
        schema:
          type: string
        description: |-
          Comma-separated test run IDs inside literal square brackets.
          Must contain at least one ID; an empty list returns 404.
          Unknown IDs are silently filtered.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestMetricListResponse'
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /cloud/v5/test_runs/{testRunId}/series:
    get:
      operationId: test_run_series_list
      summary: List time series of a test run by label-matcher.
      description: |-
        Lists the time series available in the test run that match one
        or more series selectors. Output shape mirrors the Prometheus
        series API (https://prometheus.io/docs/prometheus/latest/querying/api/#finding-series-by-label-matchers).

        At least one `match[]` argument is required. The match
        expression syntax is the same Prometheus label-matcher syntax
        used by the `metric` parameter of the query endpoints.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: testRunId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the test run.
      - in: query
        name: match[]
        required: true
        schema:
          type: array
          items:
            type: string
        description: |-
          Repeatable series-selector argument. Each value is a metric
          name optionally followed by a curly-brace label matcher,
          matching Prometheus selector syntax. Example:
          `match[]=http_req_duration{expected_response="true"}`.

          Prometheus deviation. Selectors must start with a metric
          name; a bare label-only selector such as
          `{__name__="http_req_duration"}` (which standard Prometheus
          accepts) is rejected with HTTP 400 `"Failed to parse vector
          selector"`.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromSeriesResponse'
              examples:
                OK:
                  value:
                    status: success
                    data:
                    - __name__: http_req_duration
                      expected_response: 'true'
                      group: '::g2'
                      load_zone: amazon:us:columbus
                      method: GET
                      name: http://test.k6.io/
                      proto: HTTP/1.1
                      scenario: http_with_groups
                      status: '200'
                      test_run_id: '152777'
                      url: http://test.k6.io/
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /cloud/v5/test_runs/{testRunId}/labels:
    get:
      operationId: test_run_labels_list
      summary: List label names available in a test run.
      description: |-
        Returns the set of label names available in the test run.
        Output shape mirrors the Prometheus labels API
        (https://prometheus.io/docs/prometheus/latest/querying/api/#getting-label-names).
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: testRunId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the test run.
      - in: query
        name: match[]
        required: false
        schema:
          type: array
          items:
            type: string
        description: |-
          Optional repeatable series selector. Restricts the returned
          label names to those used by series matching any of the given
          selectors. Same syntax (and same Prometheus deviation) as the
          `/series` endpoint.

          Known server bug. At the time of writing, supplying `match[]`
          on the `/labels` endpoint causes the server to return
          HTTP 500 `{"error": {"code": "error", "message": "Unknown
          error"}}` regardless of selector. Workaround: omit `match[]`
          and post-filter client-side, or use `/series` instead. The
          same parameter on `/label/{labelName}/values` is unaffected
          by this bug.
      responses:
