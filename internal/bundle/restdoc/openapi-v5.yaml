  '/cloud/v5/test_runs/{testRunId}/query_range_k6({parameters})':
    get:
      operationId: test_run_query_range_k6
      x-odata-function-call:
        name: query_range_k6
        parameters:
        - name: query
          type: Edm.String
          required: true
          description: |-
            Query expression. Must be compatible with the metric's
            `type` (see TestRunMetric.type). Single-quoted on the
            wire.
        - name: metric
          type: Edm.String
          required: true
          description: |-
            Metric name with optional Prometheus-style label selector.
            Selectors must start with a metric name; bare label-only
            selectors are rejected with 400 (Prometheus deviation).
            Unknown metric -> 200 with empty matrix.

            Label-selector operators (Prometheus subset):
              * `=`  -- equal to the given string,
              * `!=` -- not equal,
              * `=~` -- regex match,
              * `!~` -- regex non-match.

            Examples:
              * `http_req_duration`
              * `http_req_duration{status="200"}`
              * `http_req_duration{status=~"(2|3)\d\d"}`
              * `http_req_duration{status!="0",name="login page"}`
        - name: step
          type: Edm.Int64
          required: false
          description: |-
            Positive integer seconds. `step=0` and negative values
            currently return HTTP 500 (known server bug).
        - name: start
          type: Edm.DateTimeOffset
          required: false
          description: |-
            Bare OData literal -- NOT single-quoted. Must include a
            timezone designator (`Z` or `+HH:MM`). Defaults to test
            run start.
        - name: end
          type: Edm.DateTimeOffset
          required: false
          description: |-
            Bare OData literal -- NOT single-quoted. Must include a
            timezone designator (`Z` or `+HH:MM`). Defaults to test
            run end.
      summary: Range query returning a metric time series over a range.
      description: |-
        Returns multiple sample values for a given metric over a time
        range, similar to the Prometheus range-query API
        (https://prometheus.io/docs/prometheus/latest/querying/api/#range-queries).

        Wire format note. The arguments are passed in OData-style
        function-call syntax embedded in the URL path itself, not as
        conventional `?key=...` query string parameters. Actual wire
        form:

            /cloud/v5/test_runs/152779/query_range_k6(query='increase by (name,status)',metric='http_reqs{status!="0"}',step=5)

        String values must be wrapped in single quotes; when invoking
        from a shell, wrap the entire URL in double quotes so the inner
        single quotes survive shell parsing.

        Query-expression syntax. The `query` argument names a
        function applied to the metric to produce values. The
        function is built from three nesting levels: a basic method
        (required), an optional `by (...)` clause for label
        preservation, and an optional aggregator wrapper for
        across-label aggregation. The authoritative reference is the
        k6 docs at
        https://grafana.com/docs/grafana-cloud/testing/k6/reference/cloud-rest-api/metrics/

        Basic methods. The set of valid methods depends on the
        metric's `type` (see `TestRunMetric.type`). An incompatible
        pair returns HTTP 400 with a message of the form
        `"Metric query expression not found: <query> for metric
        type <type>"`.

        Each method's PromQL equivalent (where applicable) is
        included below. The mappings are taken from the official
        docs and describe how the v5 server expands the k6 method
        against the backing Prometheus-shaped store; callers that
        need to issue equivalent queries against a raw Prometheus
        instance can use them directly. Methods marked
        "(no PromQL equivalent)" are computed server-side without
        a direct Prom translation.

          * counter:
              - `increase` -- total increase over the time span
                (e.g. number of requests for `http_reqs`).
                PromQL: `increase(metric_name[$__interval])`.
              - `rate` -- average increase per second.
                PromQL: `rate(metric_name[$__interval])`.
              - `value` -- growing counter value.
                PromQL: `metric_name`.
              - `cumrate` -- cumulative rate from test run start
                (`value` / time elapsed since test run start).
                (No PromQL equivalent.)
              - `max_rate(<interval>)` -- max `rate` per
                `<interval>` seconds within the time span; the
                integer-seconds sub-parameter is required. Used e.g.
                for the "peak RPS" value in test run stats.
                PromQL:
                `max_over_time(rate(metric_name[<interval>])[$__interval:<interval>])`.
                Note: at the time of writing this method returns
                HTTP 400
                `"Metric query expression not found: max_rate(N) for
                metric type counter"` on the live API; documented
                here for parity with the docs page.

          * gauge:
              - `last` -- last observed value.
                PromQL: `metric_name`.
              - `min` -- min observed value.
                PromQL: `min_over_time(metric_name[$__interval])`.
              - `max` -- max observed value.
                PromQL: `max_over_time(metric_name[$__interval])`.
              - `avg` -- average of observed values.
                PromQL: `avg_over_time(metric_name[$__interval])`.
              - `last_time` -- timestamp of the last observed value.
                PromQL: `timestamp(metric_name)`. Note: at the time
                of writing this method returns HTTP 500 `"Unknown
                error"` on the live API; documented here for parity
                with the docs page.

          * rate:
              - `increase_total` -- total increase of the
                all-observations counter in the time span.
                PromQL: `increase(metric_name[$__interval])`.
              - `rate_total` -- average increase per second of the
                all-observations counter.
                PromQL: `rate(metric_name[$__interval])`.
              - `value_total` -- growing value of the all-
                observations counter.
                PromQL: `metric_name`.
              - `increase_nz` -- total increase of the
                nonzero-value observations counter in the time span.
                PromQL:
                `increase(metric_name{nonzero="true"}[$__interval])`.
              - `rate_nz` -- average increase per second of the
                nonzero-value observations counter.
                PromQL:
                `rate(metric_name{nonzero="true"}[$__interval])`.
              - `value_nz` -- growing value of the nonzero-value
                observations counter.
                PromQL: `metric_name{nonzero="true"}`.
              - `increase_z` -- total increase of the zero-value
                observations counter in the time span.
                PromQL:
                `increase(metric_name{nonzero="false"}[$__interval])`.
              - `rate_z` -- average increase per second of the
                zero-value observations counter.
                PromQL:
                `rate(metric_name{nonzero="false"}[$__interval])`.
              - `value_z` -- growing value of the zero-value
                observations counter.
                PromQL: `metric_name{nonzero="false"}`.
              - `ratio` -- nonzero-value increase divided by total
                increase (i.e. fraction of nonzero observations).
                PromQL:
                `increase(metric_name{nonzero="false"}[$__interval])
                / increase(metric_name[$__interval])`.

          * trend (k6 trends are histogram-backed):
              - `histogram_max`, `histogram_min`, `histogram_avg`,
                `histogram_stddev` -- standard summary statistics.
                (No PromQL equivalent.)
              - `histogram_quantile(<q>)` -- quantile of the
                histogram; `<q>` is a real number in the range
                `(0, 1)`. Required sub-parameter.
                PromQL:
                `histogram_quantile(<q>, rate(hist_metric_name_bucket[$__interval]))`.
              - `histogram_count_increase` -- increase of the
                histogram's observations counter.
                PromQL:
                `increase(hist_metric_name_count[$__interval])`.
              - `histogram_count_value` -- growing value of the
                same counter.
                PromQL: `hist_metric_name`.

        `by (<labels>)` clause. Append `by (<l1,l2,...>)` to a
        basic method to preserve those labels and return multiple
        time series (one row per unique label-value combination).
        Examples:
          * `rate by (name,status)`
          * `histogram_quantile(0.95) by (name,method,status)`

        Aggregator wrappers. Wrap a (possibly by-claused) method
        in `min(...)`, `max(...)`, `sum(...)`, or `avg(...)` to
        further aggregate across labels. The wrapper itself can
        carry its own `by (...)` clause to choose which labels to
        keep on the output. Examples:
          * `sum(last by (instance_id))` -- active VUs summed
            across instances,
          * `avg(rate by (name,method)) by (method)` -- average
            request rate across URLs, separated by HTTP method,
          * `avg(max by (instance))` -- peak per-instance value,
            averaged across instances.

        Unknown-metric note. An unrecognised metric name (e.g.
        `metric='no_such_metric'`) is not an error: the response is
        HTTP 200 with `data.resultType: "matrix"` and an empty
        `data.result` array, matching Prometheus's
        "no-matching-series-is-empty-not-error" semantics.

        Precedence note. The unknown-metric -> 200-empty behaviour
        takes priority over the incompatible query/type -> 400 check.
        If a metric does not exist in the test run, the API returns
        200-empty regardless of whether the `query` expression is
        compatible with the metric type. The 400 incompatible-type
        error only fires when the metric is present.

        `step` note. `step` must be a positive integer. The values
        `step=0` and negative values currently return HTTP 500
        `{"error": {"code": "error", "message": "Unknown error"}}`
        rather than 400 -- see the file-level Error-handling section
        for the known-bug list.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: testRunId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the test run.
      - in: path
        name: parameters
        required: true
        schema:
          type: string
        description: |-
          Comma-separated function-call arguments. Required keys:
          `query` (query expression) and `metric` (metric name with
          optional selector). Optional keys: `step` (positive integer
          seconds), `start`, and `end`.

          String keys (`query`, `metric`) must be wrapped in single
          quotes. Numeric keys (`step`) are bare.

          Datetime keys (`start`, `end`) are bare OData
          `Edm.DateTimeOffset` literals -- *not* single-quoted -- and
          must include a timezone designator (`Z` or `+HH:MM`).
          `start` defaults to test run start; `end` defaults to test
          run end. Examples of valid forms:
          `start=2025-01-01T00:00:00Z` and
          `start=2025-01-01T00:00:00+00:00`. Single-quoting a
          datetime triggers a 400 `validation_error` (see
          `BadRequest`); omitting the timezone triggers a 404
          `ParseException` (see `NotFound`).

          Example:
          `query='increase by (name,status)',metric='http_reqs{status!="0"}',step=5`.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromMatrixResponse'
              examples:
                OK:
                  value:
                    status: success
                    data:
                      resultType: matrix
                      result:
                      - metric:
                          __name__: http_reqs
                          name: login page
                          status: '200'
                          test_run_id: '152779'
                        values:
                        - [1684949415.0, 845.0]
                        - [1684949420.0, 1034.0]
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/test_runs/{testRunId}/query_aggregate_k6({parameters})':
    get:
      operationId: test_run_query_aggregate_k6
      x-odata-function-call:
        name: query_aggregate_k6
        parameters:
        - name: query
          type: Edm.String
          required: true
          description: |-
            Query expression. Same syntax (basic methods, `by (...)`
            clause, aggregator wrappers), same metric-type
            compatibility rules, and same unknown-metric semantics as
            `query_range_k6`; see that operation's description for
            the per-type method tables. Single-quoted on the wire.
        - name: metric
          type: Edm.String
          required: true
          description: |-
            Metric name with optional Prometheus-style label selector.
            Same syntax and operator set (`=`, `!=`, `=~`, `!~`) as
            on `query_range_k6`; see that operation's description.
        - name: start
          type: Edm.DateTimeOffset
          required: false
          description: |-
            Bare OData literal (must include timezone). Defaults to
            test run start.
        - name: end
          type: Edm.DateTimeOffset
          required: false
          description: |-
            Bare OData literal (must include timezone). Defaults to
            test run end.
      summary: Aggregate query returning a single value for a metric.
      description: |-
        Returns a single sample value for a given metric over the
        duration of the test run (or a sub-range of it). Output shape
        mirrors the Prometheus range-query API.

        Wire format note. The arguments are passed in OData-style
        function-call syntax embedded in the URL path itself, not as
        conventional `?key=...` query string parameters. Actual wire
        form:

            /cloud/v5/test_runs/152779/query_aggregate_k6(query='histogram_quantile(0.95) by (name,status)',metric='http_req_duration')

        String values must be wrapped in single quotes. The same
        metric-type / query-expression compatibility rules, the
        unknown-metric -> 200-empty behaviour, and the
        bare-OData-datetime requirements for `start`/`end` all apply
        here as for `query_range_k6`; see that operation's description.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: testRunId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the test run.
      - in: path
        name: parameters
        required: true
        schema:
          type: string
        description: |-
          Comma-separated function-call arguments. Required keys:
          `query` (query expression) and `metric` (metric name with
          optional selector).

          Optional keys: `start` and `end`, both bare OData
          `Edm.DateTimeOffset` literals (no surrounding quotes, must
          include a timezone designator -- see `query_range_k6` for
          the full rule). `start` defaults to test run start; `end`
          defaults to test run end.

          Example:
          `query='histogram_quantile(0.95) by (name,status)',metric='http_req_duration'`.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromVectorResponse'
              examples:
                OK:
                  value:
                    status: success
                    data:
                      resultType: vector
                      result:
                      - metric:
                          __name__: http_req_duration
                          name: http://test.k6.io/?q=2
                          status: '200'
                          test_run_id: '152779'
                        values:
                        - [1684950639.0, 14207.0]
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  '/cloud/v5/load_tests/{loadTestId}/query_aggregate_k6({parameters})':
    get:
      operationId: load_test_query_aggregate_k6
      x-odata-function-call:
        name: query_aggregate_k6
        parameters:
        - name: query
          type: Edm.String
          required: true
          description: |-
            Query expression. Same syntax (basic methods, `by (...)`
            clause, aggregator wrappers) as `query_range_k6`; see
            that operation's description for the per-type method
            tables. Single-quoted on the wire.

            NB: unlike the single-run sibling, the metric-type /
            query-expression compatibility check is NOT enforced
            here -- an incompatible pair returns 200-empty rather
            than 400. Pre-validate client-side if you need the 400.
        - name: metric
          type: Edm.String
          required: true
          description: |-
            Metric name with optional Prometheus-style label selector.
            Same syntax and operator set (`=`, `!=`, `=~`, `!~`) as
            on `query_range_k6`; see that operation's description.
        - name: test_run_count
          type: Edm.Int64
          required: false
          description: |-
            Mutually exclusive with `test_run_ids`; exactly one of
            the two is required (sending both or neither -> 404).
            Negative values -> 403 'Validation failed'.
        - name: test_run_ids
          type: Collection(Edm.Int64)
          required: false
          description: |-
            Mutually exclusive with `test_run_count`; exactly one of
            the two is required (sending both or neither -> 404).
            Empty list (`[]`) -> 404; unknown IDs silently filtered.
        - name: start
          type: Edm.DateTimeOffset
          required: false
          description: Bare OData literal (must include timezone).
        - name: end
          type: Edm.DateTimeOffset
          required: false
          description: Bare OData literal (must include timezone).
        constraints:
        - Exactly one of `test_run_count` and `test_run_ids` must be present.
      summary: Aggregate query across multiple test runs of a load test.
      description: |-
        Applies the same aggregate query to multiple runs in the same
        load test. Results for different runs are distinguished by the
        `test_run_id` label in the response. Useful for analysing
        changes in test run results over time.

        Wire format note. The arguments are passed in OData-style
        function-call syntax embedded in the URL path itself, not as
        conventional `?key=...` query string parameters. Actual wire
        form (querying the last N runs):

            /cloud/v5/load_tests/1529/query_aggregate_k6(query='histogram_quantile(0.95)',metric='http_req_duration',test_run_count=10)

        Or querying specific runs by ID:

            /cloud/v5/load_tests/1529/query_aggregate_k6(query='histogram_quantile(0.95)',metric='http_req_duration',test_run_ids=[152779,152782,152785])

        Pass exactly one of `test_run_count` and `test_run_ids`. The
        server returns 404 (OData ParseException) if both are present
        or both are omitted -- see `NotFound` Category 1.

        Response-shape note. The single-run sibling
        `/cloud/v5/test_runs/{testRunId}/query_aggregate_k6(...)`
        returns `resultType: "vector"`, but this multi-run variant
        returns `resultType: "matrix"` (one row per run, partitioned
        by the `test_run_id` label). The shape is otherwise
        identical, so this spec models both with the same
        `PromMatrixResponse` / `PromVectorResponse` schemas.

        Compatibility-check note. The single-run sibling enforces
        the metric-type / query-expression compatibility rules
        documented on `test_run_query_range_k6` (an incompatible
        pair returns HTTP 400). This multi-run endpoint does NOT
        enforce those rules: an incompatible pair (e.g. `rate` on
        a trend metric) returns HTTP 200 with an empty matrix
        (`data.resultType: "matrix"`, `data.result: []`),
        indistinguishable from the unknown-metric case. Callers
        that need the 400 must either pre-validate the metric type
        client-side (via `/test_runs/{id}/metrics` -> `type`) or
        issue the same query against the single-run endpoint as a
        canary before fanning out.
      tags:
      - metrics
      security:
      - k6ApiToken: []
      parameters:
      - in: path
        name: loadTestId
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the load test.
      - in: path
        name: parameters
        required: true
        schema:
          type: string
        description: |-
          Comma-separated function-call arguments. Required keys:
          `query` (query expression), `metric` (metric name with
          optional selector), and exactly one of `test_run_count` or
          `test_run_ids`. String values are single-quoted. Examples:
          `query='histogram_quantile(0.95)',metric='http_req_duration',test_run_count=10`
          and
          `query='histogram_quantile(0.95)',metric='http_req_duration',test_run_ids=[152779,152782,152785]`.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromMatrixResponse'
              examples:
                OK:
                  value:
                    status: success
                    data:
                      resultType: matrix
                      result:
                      - metric:
                          __name__: http_req_duration
                          test_run_id: '152779'
                        values:
                        - [1684950639.0, 14207.0]
                      - metric:
                          __name__: http_req_duration
                          test_run_id: '152782'
                        values:
                        - [1684950835.0, 28031.0]
          description: OK.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  schemas:
    TestRunMetric:
      type: object
      title: TestRunMetric
      description: One metric emitted by a test run.
      properties:
        id:
          type: string
          description: Unique identifier of the metric.
        name:
          type: string
          description: |-
            Metric name (e.g. `http_req_duration`, `vus`, `data_sent`).
        origin:
          type: string
          description: |-
            Where the metric was emitted from. Known values at the
            time of writing:
              * `"builtin"` -- built-in k6 metrics (e.g.
                `http_req_duration`, `vus`, `data_sent`,
                `browser_*`).
              * `"user"` -- user-defined metrics declared via
                `k6/metrics` in the test script.
            Treat this as an open enum; future k6 releases may add
            new origin values.
        test_run_id:
          type: integer
          format: int64
          description: ID of the test run that emitted the metric.
        type:
          type: string
          description: Metric type.
          enum: [counter, gauge, rate, trend]
      required: [id, name, origin, test_run_id, type]
    TestRunMetricListResponse:
      type: object
      title: TestRunMetricListResponse
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TestRunMetric'
      required: [value]
    LoadTestMetric:
      type: object
      title: LoadTestMetric
      description: |-
        Metric metadata aggregated across multiple runs of a load test.
      properties:
        name:
          type: string
          description: Metric name.
        type:
          type: string
          description: |-
            Metric type. If the type differs across runs, the type from
            the most-recent run is used.
          enum: [counter, gauge, rate, trend]
        labels:
          type: array
          description: |-
            All unique label names seen on this metric across the
            selected runs.
          items:
            type: string
      required: [name, type, labels]
    LoadTestMetricListResponse:
      type: object
      title: LoadTestMetricListResponse
      description: |-
        Multi-run metrics list, returned by every
        `/cloud/v5/load_tests/{id}/metrics(...)` and `/ms(...)` form
        (including the no-argument variants that default to the last
        30 runs).

        Ordering. `value[]` is sorted ASCII-alphabetically by `name`,
        case-sensitive, with no secondary sort key. Verified live
        across the plain, `test_run_count`, and `test_run_ids`
        variants. The single-run sibling
        (`TestRunMetricListResponse`) does NOT make this guarantee --
        its `value[]` is returned in metric-emission order.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/LoadTestMetric'
      required: [value]
    PromSeriesResponse:
      type: object
      title: PromSeriesResponse
      description: |-
        Prometheus-shaped series response. `data` is an array of label
        sets, one per matching time series.
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
      required: [status, data]
    PromLabelNamesResponse:
      type: object
      title: PromLabelNamesResponse
      description: |-
        Prometheus-shaped label-names response. `data` is an array of
        label names.
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: array
          items:
            type: string
      required: [status, data]
    PromLabelValuesResponse:
      type: object
      title: PromLabelValuesResponse
      description: |-
        Prometheus-shaped label-values response. `data` is an array of
        distinct values seen for the requested label.
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: array
          items:
            type: string
      required: [status, data]
    PromMatrixSample:
      type: object
      title: PromMatrixSample
      description: |-
        One time series in a Prometheus matrix response: a label set
        plus a sequence of (timestamp, value) samples.
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
          description: Label set identifying the series.
        values:
          type: array
          description: |-
            Samples, each a `[timestamp, value]` pair. Both elements
            are JSON numbers (floats on the wire). `timestamp` is a
            Unix epoch second; `value` is the metric value.

            Prometheus deviation. Standard Prometheus returns
            `[int_timestamp, "string_value"]`; the v5 API returns
            `[float_timestamp, float_value]` instead. Clients
            porting Prometheus response-parsing code should accept
            numeric values, not quoted strings.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
      required: [metric, values]
    PromMatrixResponse:
      type: object
      title: PromMatrixResponse
      description: |-
        Range-query result. `data.resultType` is always `matrix`.
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
          properties:
            resultType:
              type: string
              enum: [matrix]
            result:
              type: array
              items:
                $ref: '#/components/schemas/PromMatrixSample'
          required: [resultType, result]
      required: [status, data]
    PromVectorResponse:
      type: object
      title: PromVectorResponse
      description: |-
        Aggregate-query result for the single-run
        `/test_runs/{testRunId}/query_aggregate_k6(...)` endpoint.
        `data.resultType` is the literal `"vector"`; each entry in
        `result` is a single `[timestamp, value]` sample paired with
        a label set.

        Prometheus deviation. The entry uses `values` (an array of
        one `[timestamp, value]` pair) rather than Prometheus's
        canonical `value` (the bare pair). This keeps the entry shape
        identical to `PromMatrixSample`, so a single client type can
        cover both matrix and vector responses.

        The multi-run sibling
        `/load_tests/{loadTestId}/query_aggregate_k6(...)` uses
        `PromMatrixResponse` instead -- see that operation's
        description for the rationale.
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
          properties:
            resultType:
              type: string
              enum: [vector]
            result:
              type: array
              items:
                $ref: '#/components/schemas/PromMatrixSample'
          required: [resultType, result]
      required: [status, data]
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: |-
        Generic error envelope used by 401, 403, 404, 405, 500, and
        the simple-envelope subset of 400 responses. `ErrorResponse`
        provides no machine-readable discriminator: `error.code` is
        always the literal string `"error"` across every status that
        uses this shape, so callers needing to distinguish between
        sub-cases (e.g. the three meanings of 403 -- see
        `Forbidden`) must regex-match `error.message`. The richer
        `ValidationErrorResponse` shape (`error.code:
        "validation_error"`) is used only for the OData
        type-coercion subset of 400; see `BadRequest`.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: |-
                Stable error code. For `ErrorResponse` this is
                always the literal string `"error"` at the time of
                writing; `ValidationErrorResponse` (a sibling
                envelope used for some 400s) uses
                `"validation_error"`. There is currently no other
                value, so this field is NOT a useful discriminator
                inside `ErrorResponse`-typed responses. Treat
                `message` as the source of truth for sub-classifying
                an `ErrorResponse`.
            message:
              type: string
              description: Human-readable error description.
          required: [code, message]
      required: [error]
    ValidationErrorResponse:
      type: object
      title: ValidationErrorResponse
      description: |-
        Richer 400 envelope returned for OData type-validation
        failures (e.g. quoting a datetime value that should be a bare
        `Edm.DateTimeOffset` literal). The simpler `ErrorResponse`
        shape is returned for non-OData 400s such as an unparseable
        Prometheus selector. A 400 body is one or the other -- see
        `BadRequest` in `responses` for the `anyOf` glue.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: |-
                Stable error code. Observed value: `"validation_error"`.
            details:
              type: array
              description: |-
                Per-parameter validation errors. Each entry carries
                the OData-level `code`, a human-readable `message`,
                and the `target` parameter name.
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
                required: [code, message, target]
            message:
              type: string
              description: Top-level human-readable error description.
            target:
              type: string
              description: |-
                Operation name that the validation failure was raised
                against, e.g. `query_range_k6`.
          required: [code, details, message, target]
      required: [error]
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - $ref: '#/components/schemas/ValidationErrorResponse'
      description: |-
        Request validation failed *after* the URL parsed cleanly in
        the OData layer (URL-parse failures are 404 -- see `NotFound`).

        Discriminator note. The two envelopes can be distinguished
        unambiguously by `error.code`:
        `"error"` -> `ErrorResponse`; `"validation_error"` ->
        `ValidationErrorResponse`. The OpenAPI 3 `discriminator`
        keyword is not declared here because `error.code` is
        nested rather than top-level (and OpenAPI 3.0 `discriminator`
        requires a top-level property); strict validators should
        switch on `error.code` themselves.

        Bodies use one of two envelopes, distinguished by
        `error.code`:

        `ErrorResponse` (`error.code == "error"`):
          * `/series` called with no `match[]` argument.
          * `query_range_k6(...)` / `query_aggregate_k6(...)` with an
            unparseable Prometheus selector.
          * A query expression incompatible with the metric type
            (e.g. `rate` on a trend metric).

        `ValidationErrorResponse` (`error.code == "validation_error"`):
          * An OData literal that parsed cleanly but failed type
            coercion against the parameter's declared `Edm.*` type.
            `error.details[]` lists every offending parameter by
            `target`. Examples seen in practice:
              - `test_run_count=1.5` -- `Decimal('1.5')` does not
                coerce to `Edm.Int64`.
              - `start='2025-01-01T00:00:00Z'` -- a quoted string does
                not coerce to `Edm.DateTimeOffset`.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: |-
        Missing, malformed, or revoked token. Body is `ErrorResponse`.
        Observed `error.message` values: `"Authentication required"`
        (no header) and `"Invalid token"` (header present, token
        unrecognised).
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: |-
        Two distinct cases share this status code; distinguish them by
        `error.message`:

        `"Authentication error - could not find or access requested
        resource."` -- the caller is not authorised to access the
        resource, OR the resource does not exist. The v5 API
        deliberately conflates these two so it does not leak which
        test-run / load-test IDs exist (404 is NOT used for missing
        resources -- see `NotFound` for the distinct URL-parse 404
        case).

        `"Validation failed"` -- a server-side validator rejected a
        function-call argument. Currently observed for negative
        `test_run_count` on the multi-run operations
        (`load_tests/{id}/metrics(test_run_count=-N)`,
        `load_tests/{id}/ms(test_run_count=-N)`,
        `load_tests/{id}/query_aggregate_k6(...,test_run_count=-N)`).
        This is best thought of as a "should-have-been-400 but the
        framework picked 403" quirk; callers wanting to distinguish
        "no access" from "bad input" must inspect the message text.

        Schema-discriminator limitation. Both 403 cases currently
        share `error.code: "error"` (the literal string -- see
        ErrorResponse.error.code), so no machine-readable
        discriminator exists. Generated clients must regex-match
        `error.message` to differentiate, which is brittle against
        server-side wording changes. A future server fix should
        introduce a distinct `error.code` value (e.g.
        `"validation_error"`) for the "Validation failed" case so
        callers can branch on a stable identifier; until then this
        spec lists only the prose distinction.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: |-
        The URL did not match any OData route. Body is `ErrorResponse`
        whose `message` is the OData parser's `ParseException` text.
        Two broad categories of trigger -- the spec declares 404 on
        every operation because the second category applies
        regardless of whether the path uses function-call syntax.

        Category 1: function-call signature mismatch (function-call
        operations only):
          * `query_range_k6(metric='...',step=5)` -- missing required
            `query=` key.
          * `query_range_k6(...,bogus=1)` -- unrecognised key.
          * `query_range_k6(...,step=not-a-number)` -- value of the
            wrong literal type.
          * `query_range_k6(...,start=2025-01-01T00:00:00)` --
            timezone-naive datetime.
          * `load_tests/{id}/query_aggregate_k6(...)` with both
            `test_run_count` and `test_run_ids` (or neither).
          * `metrics(test_run_ids=[])` -- empty bracket list.

        Category 2: structural URL faults that apply to any
        operation:
          * Trailing slash: `/test_runs/{id}/metrics/`.
          * Non-numeric value where a numeric ID was expected:
            `/test_runs/abc/metrics` or `/load_tests/abc/metrics`.

        Category 3: endpoint-dependent unrecognised query-string
        parameter. The OData parser rejects unrecognised
        query-string parameters with 404 ONLY on routes it treats
        as function-call endpoints; routes treated as plain entity-
        set GETs silently ignore the parameter and return 200.
        Observed at the time of writing:
          * 404: `/test_runs/{id}/labels?foo=bar`,
                 `/test_runs/{id}/label/{name}/values?foo=bar`,
                 `/test_runs/{id}/series?foo=bar` (no `match[]`),
                 `/load_tests/{id}/metrics?foo=bar`.
          * 200 (parameter silently dropped):
                 `/test_runs/{id}/metrics?foo=bar`,
                 `/test_runs/{id}/series?foo=bar&match[]=<valid>`.
        There is no public API for determining which route shape a
        path uses; consumers that need the 404 guarantee should
        validate request URLs client-side.

        Distinct from "resource not found", which is 403 -- see
        `Forbidden`.
    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: |-
        Returned for any non-GET method (POST, PUT, PATCH, DELETE)
        on a v5 metrics path. Body is `ErrorResponse`. At the time
        of writing `error.message` is the uninformative literal
        `"Error"` (with no indication of which method was
        attempted or which methods are allowed); treat this
        wording as observed-but-not-contract -- a future server
        improvement may replace it with a more descriptive
        message, so callers should NOT hard-match on the exact
        string `"Error"`.
  securitySchemes:
    k6ApiToken:
      type: http
      scheme: bearer
      description: |-
        Token-based authentication using a k6 Personal API token or
        Grafana Stack API token. Same scheme as the v6 API.
