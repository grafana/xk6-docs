name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '~1.25'
          cache: false
      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@latest
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          xk6 build --output "k6-${GOOS}-${GOARCH}${EXT}" \
            --with github.com/grafana/xk6-docs=.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-${{ matrix.goos }}-${{ matrix.goarch }}
          path: k6-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum k6-* > checksums.txt
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            k6-*
            checksums.txt
          generate_release_notes: true

  register-version:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: grafana/k6-extension-registry/.github/workflows/register-version.yml@main
    with:
      module: github.com/grafana/xk6-docs
      version: ${{ github.ref_name }}
    secrets:
      app_id: ${{ secrets.REGISTRY_APP_ID }}
      app_pem: ${{ secrets.REGISTRY_APP_PEM }}
