name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@latest
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          xk6 build --output "k6-${GOOS}-${GOARCH}${EXT}" \
            --with github.com/grafana/xk6-docs=.
      - uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.goos }}-${{ matrix.goarch }}
          path: k6-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum k6-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            k6-*
            checksums.txt
          body: |
            - Browse k6 docs offline (`k6 x docs http get`)
            - Fuzzy search across all topics (`k6 x docs search <term>`)
            - Best practices guide (`k6 x docs best-practices`)
            - Auto-download version-matched doc bundles on first run
            - Docs stay fresh: cached bundles re-checked every 24h via ETag
            - Built-in markdown rendering for terminals
            - Configurable subtopic depth (`--depth` flag)
            - Agent-friendly raw output when piped (non-TTY)
            - Install agent skill directly: `k6 x docs skill ~/.claude/skills` (Claude Code, Cursor, Codex, and more)
          generate_release_notes: true
